{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Наш Блог</h2>
        <a href="{% url 'blog:create' %}" class="btn btn-primary">Написать статью</a>
    </div>

    <div class="row">
        {% for post in posts %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    {% if post.preview %}
                        <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text text-muted">{{ post.content|truncatechars:100 }}</p>
                    </div>
                    <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                        <small class="text-muted">👁 {{ post.views_count }}</small>
                        <a href="{% url 'blog:detail' post.pk %}" class="btn btn-sm btn-outline-secondary">Читать</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12"><p class="alert alert-secondary">Статей пока нет.</p></div>
        {% endfor %}
    </div>
</div>
{% endblock %}
