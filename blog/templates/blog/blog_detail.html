{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{{ post.title }}</h1>
    <p class="text-muted">Опубликовано: {{ post.created_at|date:"d.m.Y" }} | Просмотров: {{ post.views_count }}</p>
    
    {% if post.preview %}
        <div class="mb-4"><img src="{{ post.preview.url }}" class="img-fluid rounded" style="max-height: 400px;" alt=""></div>
    {% endif %}

    <div class="mb-4" style="white-space: pre-line;">{{ post.content }}</div>

    <div class="d-flex gap-2">
        <a href="{% url 'blog:update' post.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'blog:delete' post.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'blog:list' %}" class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
