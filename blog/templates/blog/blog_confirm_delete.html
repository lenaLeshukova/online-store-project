{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">Удаление записи</div>
        <div class="card-body">
            <p>Вы уверены, что хотите удалить статью <strong>"{{ object.title }}"</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'blog:detail' object.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
